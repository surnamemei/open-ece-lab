[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ece-lab"
dynamic = ["version"]
description = "Hardware-agnostic measurement, analysis and validation toolkit for ECE experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
open-ece = "openece.cli:main"
openece = "openece.cli:main"

[tool.setuptools.dynamic]
version = {attr = "openece.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
